<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>财务成长性指标计算｜高新技术企业认定</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-4 md:p-8">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold text-center mb-2 text-gray-800">高新技术企业认定财务成长性指标</h1>
        <p class="text-sm text-gray-500 text-center mb-6">依据国科发火〔2016〕195号，成长性满分20分（销售10分+净资产10分）</p>
        
        <form id="growth-form" class="space-y-4">
            <!-- （N-2）年数据 -->
            <div class="p-4 bg-gray-50 rounded-lg">
                <h2 class="text-lg font-semibold mb-3 text-gray-700">（N-2）年数据</h2>
                <div>
                    <label for="year1Sales" class="block text-gray-700 mb-1">销售额：</label>
                    <input type="number" id="year1Sales" step="0.01" min="0" 
                           class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" 
                           required>
                </div>
                <div class="mt-3">
                    <label for="year1Assets" class="block text-gray-700 mb-1">净资产：</label>
                    <input type="number" id="year1Assets" step="0.01" min="0" 
                           class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" 
                           required>
                </div>
            </div>
            <!-- （N-1）年数据 -->
            <div class="p-4 bg-gray-50 rounded-lg">
                <h2 class="text-lg font-semibold mb-3 text-gray-700">（N-1）年数据</h2>
                <div>
                    <label for="year2Sales" class="block text-gray-700 mb-1">销售额：</label>
                    <input type="number" id="year2Sales" step="0.01" min="0" 
                           class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" 
                           required>
                </div>
                <div class="mt-3">
                    <label for="year2Assets" class="block text-gray-700 mb-1">净资产：</label>
                    <input type="number" id="year2Assets" step="0.01" min="0" 
                           class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" 
                           required>
                </div>
            </div>
            <!-- （N）年数据 -->
            <div class="p-4 bg-gray-50 rounded-lg">
                <h2 class="text-lg font-semibold mb-3 text-gray-700">（N）年数据</h2>
                <div>
                    <label for="year3Sales" class="block text-gray-700 mb-1">销售额：</label>
                    <input type="number" id="year3Sales" step="0.01" min="0" 
                           class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" 
                           required>
                </div>
                <div class="mt-3">
                    <label for="year3Assets" class="block text-gray-700 mb-1">净资产：</label>
                    <input type="number" id="year3Assets" step="0.01" min="0" 
                           class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" 
                           required>
                </div>
            </div>
            <button type="button" onclick="calculateGrowth()" 
                    class="mt-4 bg-blue-600 text-white py-3 px-6 rounded-lg hover:bg-blue-700 transition-colors w-full text-lg font-medium">
                计算成长性指标
            </button>
            <div id="result" class="mt-6 p-4 bg-gray-50 rounded-lg hidden"></div>
        </form>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const inputs = document.querySelectorAll('input[type="number"]');
            inputs.forEach(input => {
                input.addEventListener('input', function() {
                    if (this.value < 0) {
                        this.setCustomValidity('数值不能为负数');
                    } else {
                        this.setCustomValidity('');
                    }
                });
            });
        });

        // 官方评分规则
        function getScore(growthRate) {
            if (growthRate <= 0) return 0;
            if (growthRate >= 0.35) return 9.5; // 9~10取中间展示
            if (growthRate >= 0.25) return 7.5; //7~8
            if (growthRate >= 0.15) return 5.5; //5~6
            if (growthRate >= 0.05) return 3.5; //3~4
            return 1.5; //0<r<0.05 1~2
        }

        function calculateGrowth() {
            const y1S = parseFloat(document.getElementById('year1Sales').value) || 0;
            const y2S = parseFloat(document.getElementById('year2Sales').value) || 0;
            const y3S = parseFloat(document.getElementById('year3Sales').value) || 0;
            const y1A = parseFloat(document.getElementById('year1Assets').value) || 0;
            const y2A = parseFloat(document.getElementById('year2Assets').value) || 0;
            const y3A = parseFloat(document.getElementById('year3Assets').value) || 0;
            const resultDiv = document.getElementById('result');
            resultDiv.classList.remove('hidden');

            // 校验：第2年为0，该项直接0分（官方规则）
            let errMsg = '';
            if(y2S === 0) errMsg += '⚠️ N-1年销售额为0，销售增长率按0分；\n';
            if(y2A === 0) errMsg += '⚠️ N-1年净资产为0，净资产增长率按0分；\n';
            if(y1S===0 && y2S>0) errMsg += '⚠️ N-2销售额为0，销售增长率按后两年计算；\n';
            if(y1A===0 && y2A>0) errMsg += '⚠️ N-2净资产为0，净资产增长率按后两年计算；\n';

            // 销售增长率公式
            let salesGR;
            if(y1S === 0 && y2S>0){
                salesGR = y3S / y2S - 1;
            }else if(y2S === 0){
                salesGR = -1;
            }else{
                salesGR = 0.5 * (y2S / y1S + y3S / y2S) - 1;
            }

            // 净资产增长率公式
            let assetGR;
            if(y1A === 0 && y2A>0){
                assetGR = y3A / y2A - 1;
            }else if(y2A === 0){
                assetGR = -1;
            }else{
                assetGR = 0.5 * (y2A / y1A + y3A / y2A) - 1;
            }

            const salesScore = getScore(salesGR);
            const assetScore = getScore(assetGR);
            const totalScore = salesScore + assetScore;

            resultDiv.innerHTML = `
                <h2 class="text-xl font-semibold text-gray-800 mb-3 border-b pb-2">计算结果</h2>
                ${errMsg ? `<div class="text-orange-600 mb-3 whitespace-pre-line">${errMsg}</div>` : ''}
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <h3 class="font-medium text-blue-700">销售收入增长率（满分10分）</h3>
                        <p><strong>增长率：</strong>${(salesGR*100).toFixed(2)}%</p>
                        <p><strong>该项得分：</strong>${salesScore}</p>
                    </div>
                    <div>
                        <h3 class="font-medium text-green-700">净资产增长率（满分10分）</h3>
                        <p><strong>增长率：</strong>${(assetGR*100).toFixed(2)}%</p>
                        <p><strong>该项得分：</strong>${assetScore}</p>
                    </div>
                </div>
                <div class="mt-4 p-2 bg-blue-100 rounded">
                    <p class="font-bold text-blue-800">成长性合计得分：${totalScore.toFixed(1)} / 20</p>
                </div>
                <div class="mt-3 text-xs text-gray-500">
                评分规则：≥35%（9-10）；25%~35%（7-8）；15%~25%（5-6）；5%~15%（3-4）；0~5%（1-2）；≤0为0分
                </div>
            `;
        }
    </script>
</body>
</html>
